# =============================================================================
# Case timeline (P3.9) — which dates on each board are milestones
# =============================================================================
# Read by libs/query/src/case-timeline.ts via loadTimelineConfig().
#
# `column` is the logical column key from boards.yaml (the key in a row's
# column_values JSON), not Monday's column id. A row whose column is empty adds
# nothing.
#
# Labels and details are templates:
#   {col}           the column's text / status label / tag labels
#   {col|fallback}  ... or `fallback` when the column is empty
#   {status}        the item's Status
#   {who}           " — <first names>" when an Open Form is for someone other
#                   than the client (a spouse or child on the same profile)
#
# Tracks: court · uscis · fees · meetings · notes
# Kinds:  milestone · filing · decision · hearing · deadline · meeting · call · note · change
#
# History (item_events — the item activity log): every board here gets its
# status / group changes as `change` events (leaving out data entry in the
# item's first hour). `moved` (optional) lists date columns whose old values
# show crossed out each time the date was changed (not in the first 24 h).
#
# `edit` (optional): columns the event panel shows first when someone clicks an
# event, before the item's other fields. A milestone's column and `status` are
# always first; list here what a rule reads (rules have no milestone columns).
#
# Rows whose name contains "(copy)" are skipped everywhere (Monday duplicates).
#
# Rules that need more than a date + label (court outcome from the item name,
# hearing outcomes, appeals, motions, RFEs/denials, appointments, Fee K
# signing) are in code: see RULES in case-timeline.ts. A board listed here can
# have both `milestones` and a `rule`.
# =============================================================================

boards:
  court_cases:
    track: court
    rule: court_outcome
    edit: [case_prep_status]
    milestones:
      - { column: nta_date, kind: milestone, label: "NTA issued" }
      - { column: app_filed, kind: filing, label: "{relief|Application} filed with court" }
      - { column: wps_filed_on, kind: filing, label: "WPS filed" }
      - { column: wl_filed, kind: filing, label: "Witness list filed" }
      - { column: fp_date, kind: milestone, label: "Biometrics (fingerprints)" }

  calendaring:
    track: court
    rule: calendaring
    # Status is the hearing's outcome (ATTENDED, RECHED/ CONT/ … NOT HAPPENING,
    # WITHDREW, VISITING IJ NO SHOW); "Needs attention" asks for it.
    edit: [hearing_date_calendaring, interview_date, due_date, calendaring_quick_note]
    # Each time a hearing / interview date was changed (item activity log), the
    # old date shows crossed out: "moved to Nov 20, 2026 on Oct 2, 2026 by …".
    moved:
      - { column: hearing_date_calendaring, kind: hearing, label: "{type|Court} hearing" }
      - { column: interview_date, kind: hearing, label: "USCIS interview", track: uscis }

  appeals:
    track: court
    rule: appeal
    edit: [appeal_due, appeal_filed_on]

  motions:
    track: court
    rule: motion
    # Granted / Denied + Dec. Date record the judge's decision.
    edit: [mtn_filed_on, dec_date]

  address_changes:
    track: court
    milestones:
      - { column: date_sent, kind: filing, label: "Change of address filed" }

  # Federal cases (habeas, petitions for review, mandamus). The board has no
  # filed date and its outcome (Status of Complaint) has none either, so only
  # work due and federal hearings show. Its "Immigration Hearing Date" mirrors
  # the court case's hearing, which Calendaring already shows.
  litigation:
    track: court
    edit: [status_of_complaint, work_due, current_status]
    milestones:
      - { column: due_date, kind: deadline, label: "{type_of_case|Federal case}: {work_due|work} due" }
      - { column: hearing_date, kind: milestone, label: "{type_of_case|Federal case} hearing (federal court)" }

  _cd_open_forms:
    track: uscis
    # The interview item ("... I589 INTERVIEW ...") is skipped: Calendaring
    # carries the interview itself.
    skip_name: "INTERVIEW"
    milestones:
      - { column: hire_date, kind: milestone, label: "Hired for {forms|forms}{who}" }
      - { column: forms_appt_date, kind: meeting, label: "Forms appointment: {forms|forms}{who}" }
      - { column: forms_sent_date, kind: filing, label: "{forms|Forms} sent to USCIS{who}" }
      - { column: received_priority_date, kind: milestone, label: "{forms|Forms} receipt notice{who}", detail: "Receipt status: {receipt_status|—}" }

  rfes_all:
    track: uscis
    rule: rfe
    # Its dates mirror Calendaring (read-only here); Status records the
    # response — "Sent out" meets the deadline (see the rfe rule).

  _na_originals_cards_notices:
    track: uscis
    milestones:
      - { column: date_received, kind: milestone, label: "Originals received: {what_we_have|documents}", detail: "Status: {status}" }

  # Consular processing: one item per NVC notice.
  nvc_notices:
    track: uscis
    milestones:
      - { column: notice_date, kind: milestone, label: "NVC: {notice_type|notice}", detail: "Status: {status|open}" }

  # FOIA requests (EOIR, USCIS, FBI, OBIM, CBP). "FOIA filed" is a milestone,
  # not a filing: a filing on the USCIS track would hide a missed RFE deadline
  # in "Needs attention".
  foias:
    track: uscis
    milestones:
      - { column: filed_on, kind: milestone, label: "FOIA filed: {foias_filed|agencies}", detail: "Status: {status}" }
      - { column: results_received, kind: milestone, label: "FOIA results received" }

  # U visa law-enforcement certification. Expiration and the hire deadline are
  # milestones, not deadlines: a U visa filed BEFORE the date is the good case,
  # and "nothing filed since" would flag it. Upcoming ones still show in
  # "Coming up"; the I-918B alerts cover expiring certifications.
  _lt_i918b_s:
    track: uscis
    milestones:
      - { column: hire_date_for_i918b_request, kind: milestone, label: "I-918B certification requested", detail: "Status: {status}" }
      - { column: signed_date, kind: decision, label: "I-918B signed by the agency" }
      - { column: due_date_for_u_visa_hire, kind: milestone, label: "Hire for the U visa by" }
      - { column: expiration_date, kind: milestone, label: "I-918B expires" }

  call_log:
    track: meetings
    milestones:
      - { column: date, kind: call, label: "Client call", detail: "Status: {status}" }

  # Every attorney board (appointments_<initials>) uses the same rule.
  appointments_*:
    track: meetings
    rule: appointment
    edit: [consult_date]
    moved:
      - { column: consult_date, kind: meeting, label: "Consult (rescheduled)" }

# Fee Ks live in the contracts table, not board_items.
contracts:
  track: fees
  rule: contract
  milestones:
    - { column: payment_link_sent_on, kind: milestone, label: "Payment link sent" }

# Emails & Activities types that are milestones. Only the first line of the
# entry is shown; the body goes in the detail. A "Filing Complete" on the same
# day as a filing the boards already show is folded into that filing's detail.
activities:
  # skip_if: entries that are chat, not a filing ("I was wondering why...").
  "Filing Complete": { track: court, kind: filing, uscis_if: "RFE|USCIS|I-?765|Fedex", skip_if: "^(I |Tried|So |We )" }
  "HEARING NOTICE": { track: court, kind: milestone, label: "Hearing notice: {first}" }
  "IJ - Order/Decision": { track: court, kind: decision, label: "IJ order received" }
  "USCIS FF Payment": { track: uscis, kind: milestone, label: "USCIS filing fee paid" }
  "EOIR FF Payment": { track: court, kind: milestone, label: "EOIR filing fee paid" }
  # Logged the day the notice arrives; the interview itself is on Calendaring.
  # Fixed label: the first line is free text ("N400 INTERVIEW Fees: $2,500…").
  "INTERVIEW NOTICE": { track: uscis, kind: milestone, label: "Interview notice" }
  # The attorney's notes from a hearing; the first line is just date + names.
  "HEARING NOTES": { track: court, kind: note, label: "Hearing notes" }
  "CASE STRAT": { track: notes, kind: note, label: "Case strategy discussed" }
  "Deadline": { track: notes, kind: note, label: "Deadline logged" }
