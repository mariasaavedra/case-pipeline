# nginx config for the web container. Serves the static React bundle and proxies
# API traffic to the `api` service on the compose network — the production
# equivalent of the Vite dev server's `/api` proxy (apps/web/vite.config.ts).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers (security-headers.conf). nginx drops server-level add_header
  # lines in any location that sets its own, so each such location below
  # includes the file again — a location without the include serves none.
  include /etc/nginx/snippets/security-headers.conf;

  # Compression. nginx ships with gzip OFF, so without this every response — the
  # ~700 KB JS bundle AND the proxied /api JSON — went out uncompressed. The
  # heaviest real payload (/api/appointments?range=week) is 312 KB raw / 46 KB
  # gzipped, so `gzip_proxied` matters as much as the static side here.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  # No woff2 here on purpose: woff2 is already Brotli-compressed internally, so
  # gzipping it burns CPU and comes out 43 bytes LARGER (measured).
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # API + OAuth (everything the server handles lives under /api/*).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Mail scan upload. nginx's defaults — 1 MB bodies, 60 s to answer — are both
  # too small here: the API takes PDFs up to 40 MB (MAX_PDF_BYTES in
  # apps/api/src/routes/mail.ts), and OCR runs ~10 s a page on the 1-vCPU
  # server (4 pages took 44 s), so a normal scan outlasts 60 s and got a 504.
  location = /api/mail/scan {
    client_max_body_size 40m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering on;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The other two raw-file uploads, which got nginx's 1 MB default while the API
  # takes far more: a contract PDF sent for signature (15 MB, MAX_PDF_BYTES in
  # apps/api/src/routes/esign.ts) and a file attached to a consult prep (25 MB,
  # PREP_FILE_MAX_BYTES in routes/reception.ts). A phone photo or a scanned
  # contract met a 413 from nginx before the API ever saw it.
  location ~ ^/api/contracts/[^/]+/esign$ {
    client_max_body_size 16m;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~ ^/api/reception/consults/[^/]+/files$ {
    client_max_body_size 26m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Health probe passthrough (the endpoint lives outside /api by design).
  location = /health {
    proxy_pass http://api:3000/health;
  }

  # Client upload files (docs/features/client-uploads.md): one file per request,
  # up to 50 MB (MAX_FILE_BYTES in apps/api/src/uploads/rules.ts), from phones on
  # slow data — so a bigger body limit and a longer wait than /api/'s defaults.
  # Streamed to the API as it arrives, so nginx doesn't hold 50 MB on disk first.
  location ^~ /api/u/ {
    client_max_body_size 51m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The client upload page, /u/<token>: its own small bundle (upload.html), not
  # the dashboard. The token is in the URL, so no Referer to anyone and no
  # search engine indexing; never cached, like index.html.
  location ^~ /u/ {
    add_header Cache-Control "no-store, must-revalidate";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex, nofollow";
    include /etc/nginx/snippets/security-headers.conf;
    try_files /upload.html =404;
  }

  # Hashed build assets (index-<hash>.js/css) are immutable — a new build gets a
  # new filename — so cache them hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # SPA fallback — client-side routing serves index.html for unknown paths.
  # index.html must NEVER be cached: it's the pointer to the current hashed
  # assets, so a stale copy pins the browser to an old bundle (the exact bug
  # that made status editing look broken across deploys).
  location / {
    add_header Cache-Control "no-store, must-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
