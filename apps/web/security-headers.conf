# Security headers for every response nginx serves (included from nginx.conf,
# copied to /etc/nginx/snippets/ by Dockerfile.web). Keep CSP_POLICY in
# apps/web/vite.config.ts the same, so `vite preview` tests what ships.
#
# The CSP limits where SCRIPTS come from — the part that turns an HTML injection
# (an e-mail body in the timeline) into code running with a staff member's token.
# It sets no default-src on purpose: MSAL sign-in, Graph and SharePoint calls,
# Monday file images in notes and blob: PDF previews all keep working.
#   script-src 'self'       no inline or third-party scripts (index.html has none)
#   object-src 'none'       no plugins
#   base-uri 'self'         an injected <base> can't redirect relative URLs
#   form-action 'self'      an injected <form> can't post anywhere else
#   frame-ancestors 'self'  no other site can frame the app; not 'none', because
#                           MSAL's silent token renewal loads our own page in an iframe
add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
