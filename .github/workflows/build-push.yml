name: Build & Push Images

# Build the API and web Docker images on GitHub's runners (x86, plenty of RAM)
# and push them to GitHub Container Registry (GHCR). The production server never
# builds — it only pulls these prebuilt images. This is what keeps the 1 GB
# droplet from OOM-ing on the Vite build.
#
# Deploy on the server after this workflow succeeds:
#   cd ~/case-pipeline-new && git pull && docker compose pull && docker compose up -d

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase. Owner = the repo owner.
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/case-pipeline-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/case-pipeline-web

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the owner (GHCR rejects uppercase); github.repository_owner may
      # contain capitals. Expose ready-to-use image refs to later steps.
      - name: Compute image refs
        id: refs
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "api=${{ env.REGISTRY }}/${owner}/case-pipeline-api" >> "$GITHUB_OUTPUT"
          echo "web=${{ env.REGISTRY }}/${owner}/case-pipeline-web" >> "$GITHUB_OUTPUT"
          # Fallback build date for runs with no head_commit (workflow_dispatch).
          echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64 # the droplet is x86_64
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.refs.outputs.api }}:latest
            ${{ steps.refs.outputs.api }}:${{ github.sha }}
          # No layer cache: the gha cache was restoring stale source into `COPY . .`,
          # producing images with old code stamped with the new commit SHA (a whole
          # release of "fixes" never reached users). Clean builds, every time.
          no-cache: true

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
            # head_commit exists only on `push`. This workflow also runs via
            # workflow_dispatch (used whenever a push event is delayed or lost),
            # where it is empty and the badge would ship with no date — so fall
            # back to the run's own start time.
            BUILD_DATE=${{ github.event.head_commit.timestamp || steps.refs.outputs.now }}
          tags: |
            ${{ steps.refs.outputs.web }}:latest
            ${{ steps.refs.outputs.web }}:${{ github.sha }}
          # See the API build above — clean builds so the shipped bundle always
          # matches the committed source.
          no-cache: true
