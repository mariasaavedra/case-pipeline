name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Known-vulnerable runtime dependencies fail the build instead of piling
      # up: by the 2026-10-24 audit there were 23 (3 critical). Dev-only tools
      # (xlsx for `npm run stats`, which has no fix) are left out by --omit=dev.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Preflight
        run: npm run preflight

      - name: Typecheck
        run: npm run typecheck

      # Ratchet, not a cleanup gate: `lint` passes today over the existing
      # ~50k LOC and fails on new ESLint *errors*. The 55 pre-existing warnings
      # are tracked but not blocking — `npm run lint:strict` is the stricter
      # gate to switch to once that count reaches zero.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Typecheck alone does not catch a broken Vite/tsc build, and the build is
      # where the web app actually breaks. Without this the first sign of a bad
      # build is the image build in build-push.yml — after merge to main.
      - name: Build
        run: npm run build

  # The staff manual (apps/web/src/manual, P22) is updated in the same PR as
  # the change staff will see. A PR that touches the web app's screens or the
  # API's routes without touching the manual fails here, unless its
  # description says "Manual: n/a" and why (a refactor, a test, a fix nobody
  # sees). See "Staff manual" in CLAUDE.md.
  manual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Manual updated with the change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          changed=$(git diff --name-only "$BASE"..."$HEAD")
          screens=$(echo "$changed" | grep -E '^apps/web/src/(components|pages)/.*\.tsx$|^apps/api/src/routes/' | grep -vE '\.test\.tsx?$' || true)
          manual=$(echo "$changed" | grep -E '^apps/web/src/(manual/chapters/|changelog\.ts)' || true)
          if [ -z "$screens" ]; then echo "No screen or route changes."; exit 0; fi
          if [ -n "$manual" ]; then echo "Manual updated:"; echo "$manual"; exit 0; fi
          if printf '%s' "$BODY" | grep -qiE 'manual:[[:space:]]*n/?a'; then echo "Marked 'Manual: n/a' in the PR description."; exit 0; fi
          echo "::error::This PR changes screens or routes but not the staff manual (apps/web/src/manual/chapters/)."
          echo "Update the chapter for the page that changed, or add 'Manual: n/a — <why>' to the PR description."
          echo "Changed:"; echo "$screens"
          exit 1
