name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Preflight
        run: npm run preflight

      - name: Typecheck
        run: npm run typecheck

      # Ratchet, not a cleanup gate: `lint` passes today over the existing
      # ~50k LOC and fails on new ESLint *errors*. The 55 pre-existing warnings
      # are tracked but not blocking — `npm run lint:strict` is the stricter
      # gate to switch to once that count reaches zero.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Typecheck alone does not catch a broken Vite/tsc build, and the build is
      # where the web app actually breaks. Without this the first sign of a bad
      # build is the image build in build-push.yml — after merge to main.
      - name: Build
        run: npm run build
